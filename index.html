<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY PORTAL | TRPG & Murder Mystery</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #334155;
      border-radius: 9999px;
    }
    /* 管理者モード専用の表示制御 */
    .admin-only {
      display: none !important;
    }
    body.is-admin .admin-only {
      display: inline-flex !important;
    }
    body.is-admin div.admin-only-block {
      display: block !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

  <!-- ナビゲーションバー -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
          <i class="fa-solid fa-dice-d20 text-white text-xl"></i>
        </div>
        <span class="font-bold text-lg tracking-wider text-slate-100" id="headerName">PORTAL</span>
      </div>

      <!-- メインタブボタン -->
      <nav class="flex items-center space-x-2">
        <button onclick="switchTab('home')" id="tab-home" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 bg-purple-600/20 text-purple-300 border border-purple-500/30">
          <i class="fa-solid fa-house"></i>
          <span>ホーム</span>
        </button>
        <button onclick="switchTab('trpg')" id="tab-trpg" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
          <i class="fa-solid fa-dice-d20"></i>
          <span>TRPG</span>
        </button>
        <button onclick="switchTab('murder-mystery')" id="tab-murder-mystery" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
          <!-- 剣アイコン -->
          <i class="fa-solid fa-shield-halved"></i>
          <span>Murder Mystery</span>
        </button>

        <!-- 管理者ログイン / 閲覧モード切り替えボタン -->
        <div class="pl-4 border-l border-slate-800 ml-2">
          <button onclick="toggleAdminPrompt()" id="adminToggleBtn" title="管理モード切替" class="p-2 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-slate-800 transition">
            <i class="fa-solid fa-lock" id="adminLockIcon"></i>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

    <!-- ==================== 1. ホーム ==================== -->
    <section id="view-home" class="space-y-8">
      
      <!-- プロフィールセクション -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative overflow-hidden shadow-xl">
        <div class="flex flex-col md:flex-row items-center md:items-start gap-6">
          <div class="relative group">
            <img id="profAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop" alt="Avatar" class="w-28 h-28 rounded-2xl object-cover border-2 border-purple-500/40 shadow-inner">
          </div>
          <div class="flex-1 text-center md:text-left space-y-3">
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3">
              <h1 class="text-2xl font-bold text-white tracking-wide" id="profName">PLAYER NAME</h1>
              <button onclick="openProfileModal()" class="admin-only text-xs px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition">
                <i class="fa-solid fa-pen text-[10px] mr-1"></i>プロフィール編集
              </button>
            </div>
            <p class="text-slate-400 text-sm max-w-2xl leading-relaxed whitespace-pre-wrap" id="profBio">TRPGとマーダーミステリーを楽しんでいます。キャラクターや通過シナリオのまとめ用ポータルです。</p>
            
            <!-- SNS・連絡先リンク（動的生成） -->
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 pt-2" id="profLinksContainer">
              <!-- JSで生成 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 下部2カラム：フレンドコード & カレンダー -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- フレンドコード -->
        <div class="lg:col-span-5 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-address-card text-purple-400"></i>
              <span>フレンドコード</span>
            </h2>
            <button onclick="openFriendCodeModal()" class="admin-only text-xs px-2.5 py-1 rounded bg-purple-600/30 text-purple-300 hover:bg-purple-600/50 border border-purple-500/40 transition">
              <i class="fa-solid fa-plus mr-1"></i>追加
            </button>
          </div>
          <div id="friendCodesList" class="space-y-3">
            <!-- JS生成 -->
          </div>
        </div>

        <!-- カレンダー -->
        <div class="lg:col-span-7 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-calendar-days text-purple-400"></i>
              <span id="calendarMonthTitle">予定カレンダー</span>
            </h2>
            <div class="flex items-center space-x-2">
              <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">
                <i class="fa-solid fa-chevron-left text-xs"></i>
              </button>
              <button onclick="changeMonth(1)" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">
                <i class="fa-solid fa-chevron-right text-xs"></i>
              </button>
              <button onclick="openScheduleModal()" class="admin-only text-xs px-2.5 py-1 rounded bg-purple-600/30 text-purple-300 hover:bg-purple-600/50 border border-purple-500/40 transition ml-2">
                <i class="fa-solid fa-plus mr-1"></i>予定追加
              </button>
            </div>
          </div>
          
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <!-- 曜日ヘッダー -->
            <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
              <div class="text-rose-400">日</div>
              <div>月</div>
              <div>火</div>
              <div>水</div>
              <div>木</div>
              <div>金</div>
              <div class="text-sky-400">土</div>
            </div>
            <!-- 日付グリッド -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1">
              <!-- JS生成 -->
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ==================== 2. TRPG ==================== -->
    <section id="view-trpg" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-dice-d20 text-purple-400"></i>
            <span>TRPG キャラクター一覧</span>
          </h2>
          <p class="text-xs text-slate-400 mt-1">作成した探索者・キャラクターの設定と伏せ感想リンク集</p>
        </div>
        <button onclick="openTrpgModal()" class="admin-only self-start sm:self-auto px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium shadow-lg shadow-purple-600/30 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i>
          <span>キャラクター作成</span>
        </button>
      </div>

      <!-- キャラクターカード一覧 -->
      <div id="trpgList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS生成 -->
      </div>
    </section>

    <!-- ==================== 3. Murder Mystery ==================== -->
    <section id="view-murder-mystery" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-purple-400"></i>
            <span>Murder Mystery 通過記録</span>
          </h2>
          <p class="text-xs text-slate-400 mt-1">通過したマダミスシナリオ・担当キャラクターと感想まとめ</p>
        </div>
        <button onclick="openMurderMysteryModal()" class="admin-only self-start sm:self-auto px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium shadow-lg shadow-purple-600/30 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i>
          <span>シナリオ記録の追加</span>
        </button>
      </div>

      <!-- マダミス一覧 -->
      <div id="murderMysteryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS生成 -->
      </div>
    </section>

  </main>

  <!-- ==================== 各種モーダル ==================== -->

  <!-- プロフィール編集モーダル -->
  <div id="modalProfile" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-user-pen text-purple-400"></i>
        <span>プロフィール編集</span>
      </h3>
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-slate-300 font-medium mb-1">名前</label>
          <input type="text" id="inputProfName" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">アイコン画像</label>
          <div class="flex items-center gap-3">
            <img id="previewProfAvatar" src="" class="w-12 h-12 rounded-lg object-cover bg-slate-800 border border-slate-700">
            <input type="file" id="inputProfAvatarFile" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
          </div>
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">自己紹介</label>
          <textarea id="inputProfBio" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500"></textarea>
        </div>
        
        <!-- 動的リンク追加部分 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-slate-300 font-medium">SNS・連絡先リンク</label>
            <button type="button" onclick="addProfileLinkRow()" class="text-xs text-purple-400 hover:text-purple-300">
              <i class="fa-solid fa-plus mr-1"></i>リンク枠を追加
            </button>
          </div>
          <div id="profileLinksEditor" class="space-y-2">
            <!-- JSで行を追加 -->
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('modalProfile')" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-sm">キャンセル</button>
        <button onclick="saveProfile()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium">保存</button>
      </div>
    </div>
  </div>

  <!-- フレンドコード追加モーダル -->
  <div id="modalFriendCode" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-plus text-purple-400"></i>
        <span>フレンドコード追加</span>
      </h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-300 font-medium mb-1">プラットフォーム名（Steam, Switch, PSN 等）</label>
          <input type="text" id="inputFcPlatform" placeholder="例: Switch" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">コード・ID</label>
          <input type="text" id="inputFcCode" placeholder="例: SW-1234-5678-9012" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('modalFriendCode')" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-sm">キャンセル</button>
        <button onclick="saveFriendCode()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium">追加</button>
      </div>
    </div>
  </div>

  <!-- 予定追加モーダル -->
  <div id="modalSchedule" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-calendar-plus text-purple-400"></i>
        <span>セッション予定追加</span>
      </h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-300 font-medium mb-1">日付</label>
          <input type="date" id="inputSchedDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">シナリオ・卓名</label>
          <input type="text" id="inputSchedTitle" placeholder="例: 狂気山脈 卓" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">時間・メモ</label>
          <input type="text" id="inputSchedNote" placeholder="例: 21:00〜 / KP: ○○さん" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('modalSchedule')" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-sm">キャンセル</button>
        <button onclick="saveSchedule()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium">追加</button>
      </div>
    </div>
  </div>

  <!-- TRPG キャラクター追加・編集モーダル -->
  <div id="modalTrpg" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-dice-d20 text-purple-400"></i>
        <span id="trpgModalTitle">TRPG キャラクター</span>
      </h3>
      <input type="hidden" id="trpgEditId">
      <div class="space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 font-medium mb-1">キャラクター名</label>
            <input type="text" id="inputTrpgName" placeholder="名前" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">システム</label>
            <input type="text" id="inputTrpgSystem" placeholder="例: 新クトゥルフ / エモクロア" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">立ち絵・アイコン画像</label>
          <div class="flex items-center gap-3">
            <img id="previewTrpgImg" src="" class="w-14 h-14 rounded-lg object-cover bg-slate-800 border border-slate-700 hidden">
            <input type="file" id="inputTrpgImgFile" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">キャラシートURL (いあきゃら等)</label>
          <input type="url" id="inputTrpgSheetUrl" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">性格・特徴・生い立ち設定</label>
          <textarea id="inputTrpgBio" rows="4" placeholder="性格や裏設定などを自由に記入" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500"></textarea>
        </div>

        <!-- ふせったーリンク集 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-slate-300 font-medium">ふせったー等の感想URL</label>
            <button type="button" onclick="addFusetterLinkRow('trpgFusetterList')" class="text-xs text-purple-400 hover:text-purple-300">
              <i class="fa-solid fa-plus mr-1"></i>URL追加
            </button>
          </div>
          <div id="trpgFusetterList" class="space-y-2">
            <!-- JSで動的行追加 -->
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('modalTrpg')" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-sm">キャンセル</button>
        <button onclick="saveTrpgCharacter()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium">保存</button>
      </div>
    </div>
  </div>

  <!-- Murder Mystery 追加・編集モーダル -->
  <div id="modalMurderMystery" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-6 space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-purple-400"></i>
        <span id="murderMysteryModalTitle">Murder Mystery 記録</span>
      </h3>
      <input type="hidden" id="mmEditId">
      <div class="space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 font-medium mb-1">シナリオタイトル</label>
            <input type="text" id="inputMmScenario" placeholder="シナリオ名" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">担当キャラクター (HO)</label>
            <input type="text" id="inputMmChar" placeholder="担当した役職/キャラ名" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">画像 (パッケージ・キャラ画像等)</label>
          <div class="flex items-center gap-3">
            <img id="previewMmImg" src="" class="w-14 h-14 rounded-lg object-cover bg-slate-800 border border-slate-700 hidden">
            <input type="file" id="inputMmImgFile" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">ネタバレなし一言感想</label>
          <textarea id="inputMmReview" rows="2" placeholder="公開できる簡単な一言感想" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-purple-500"></textarea>
        </div>

        <!-- ふせったーリンク集 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-slate-300 font-medium">ふせったー等のネタバレ感想URL</label>
            <button type="button" onclick="addFusetterLinkRow('mmFusetterList')" class="text-xs text-purple-400 hover:text-purple-300">
              <i class="fa-solid fa-plus mr-1"></i>URL追加
            </button>
          </div>
          <div id="mmFusetterList" class="space-y-2">
            <!-- JSで動的行追加 -->
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
        <button onclick="closeModal('modalMurderMystery')" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-sm">キャンセル</button>
        <button onclick="saveMurderMystery()" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium">保存</button>
      </div>
    </div>
  </div>

  <!-- キャラクター詳細閲覧モーダル（TRPG用） -->
  <div id="modalCharDetail" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-6 space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-4">
          <img id="detailCharImg" src="" class="w-16 h-16 rounded-xl object-cover border border-purple-500/40">
          <div>
            <span id="detailCharSystem" class="text-xs px-2.5 py-0.5 rounded-full bg-purple-600/30 text-purple-300 border border-purple-500/30 font-medium"></span>
            <h3 id="detailCharName" class="text-2xl font-bold text-white mt-1"></h3>
          </div>
        </div>
        <button onclick="closeModal('modalCharDetail')" class="text-slate-400 hover:text-white p-2">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-4 text-sm text-slate-300">
        <div id="detailCharSheetArea">
          <a id="detailCharSheetUrl" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-400 hover:text-purple-300 border border-slate-700 text-xs transition">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>キャラクターシートを開く</span>
          </a>
        </div>

        <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80">
          <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">性格・設定・生い立ち</h4>
          <p id="detailCharBio" class="whitespace-pre-wrap leading-relaxed text-slate-200"></p>
        </div>

        <div>
          <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
            <i class="fa-solid fa-comment-dots text-purple-400"></i>
            <span>感想・ふせったー一覧</span>
          </h4>
          <div id="detailCharFusetterList" class="space-y-2">
            <!-- JS生成 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    /* ==========================================================
       1. データ管理 & 初期データ
    ========================================================== */
    const STORAGE_KEY = 'portal_site_data_v2';
    const ADMIN_STORAGE_KEY = 'portal_site_is_admin';

    // デフォルトデータ
    const defaultData = {
      profile: {
        name: "陽葵",
        bio: "TRPGとマーダーミステリーを楽しんでいます。\n通過シナリオやキャラクターのまとめです。",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop",
        links: [
          { title: "X (Twitter)", url: "https://x.com" },
          { title: "Discord", url: "https://discord.gg" }
        ]
      },
      friendCodes: [
        { id: 1, platform: "Steam", code: "123456789" },
        { id: 2, platform: "Nintendo Switch", code: "SW-0000-0000-0000" },
        { id: 3, platform: "Discord", code: "user_name#0000" }
      ],
      schedules: [
        { id: 1, date: "2026-10-15", title: "狂気山脈", note: "21:00〜 KP:〇〇さん" }
      ],
      trpgChars: [
        {
          id: 1,
          name: "月読 怜",
          system: "新クトゥルフ",
          avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&h=300&fit=crop",
          sheetUrl: "https://iachara.com",
          bio: "冷静沈着な民俗学者。オカルトや各地の伝承のフィールドワークが趣味。",
          fusetters: [
            { label: "狂気山脈 通過後感想（ネタバレ）", url: "https://fse.tw" }
          ]
        }
      ],
      murderMysteries: [
        {
          id: 1,
          scenario: "狂気山脈 陰謀の分水嶺",
          character: "登山家",
          image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&h=300&fit=crop",
          review: "非常に熱い議論ができました！最高の体験でした。",
          fusetters: [
            { label: "通過後ネタバレ感想ふせったー", url: "https://fse.tw" }
          ]
        }
      ]
    };

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return defaultData;
      try {
        return JSON.parse(saved);
      } catch (e) {
        return defaultData;
      }
    }

    let siteData = loadData();

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData));
    }

    /* ==========================================================
       2. 管理者／閲覧モード判定
    ========================================================== */
    // URLに ?admin=true があるか、localStorageにフラグがあれば管理者として動作
    const urlParams = new URLSearchParams(window.location.search);
    let isAdmin = urlParams.get('admin') === 'true' || localStorage.getItem(ADMIN_STORAGE_KEY) === 'true';

    function applyAdminMode() {
      const lockIcon = document.getElementById('adminLockIcon');
      if (isAdmin) {
        document.body.classList.add('is-admin');
        lockIcon.className = 'fa-solid fa-lock-open text-amber-400';
      } else {
        document.body.classList.remove('is-admin');
        lockIcon.className = 'fa-solid fa-lock text-slate-400';
      }
    }

    function toggleAdminPrompt() {
      if (isAdmin) {
        if (confirm("管理者モード（編集権限）を解除し、閲覧専用モードに戻しますか？")) {
          isAdmin = false;
          localStorage.removeItem(ADMIN_STORAGE_KEY);
          applyAdminMode();
        }
      } else {
        const pass = prompt("管理者パスワードを入力してください（初期設定: admin）:");
        if (pass === "admin" || pass === "1234") { // パスワードはお好みで変更してください
          isAdmin = true;
          localStorage.setItem(ADMIN_STORAGE_KEY, 'true');
          applyAdminMode();
          alert("管理者モードになりました。編集・追加が行えます！");
        } else if (pass !== null) {
          alert("パスワードが違います。");
        }
      }
    }

    /* ==========================================================
       3. タブ切り替え
    ========================================================== */
    function switchTab(tabId) {
      ['home', 'trpg', 'murder-mystery'].forEach(id => {
        const view = document.getElementById(`view-${id}`);
        const btn = document.getElementById(`tab-${id}`);
        if (id === tabId) {
          view.classList.remove('hidden');
          btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 bg-purple-600/20 text-purple-300 border border-purple-500/30";
        } else {
          view.classList.add('hidden');
          btn.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
        }
      });
    }

    /* ==========================================================
       4. レンダリング処理
    ========================================================== */
    // プロフィール表示
    function renderProfile() {
      const p = siteData.profile;
      document.getElementById('profName').innerText = p.name || "PLAYER";
      document.getElementById('headerName').innerText = (p.name || "PORTAL") + " PORTAL";
      document.getElementById('profBio').innerText = p.bio || "";
      document.getElementById('profAvatar').src = p.avatar || "https://via.placeholder.com/150";

      const linksContainer = document.getElementById('profLinksContainer');
      linksContainer.innerHTML = '';
      (p.links || []).forEach(l => {
        if (!l.url) return;
        const a = document.createElement('a');
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs border border-slate-700/80 transition";
        a.innerHTML = `<i class="fa-solid fa-link text-purple-400 text-[11px]"></i><span>${escapeHtml(l.title || 'Link')}</span>`;
        linksContainer.appendChild(a);
      });
    }

    // フレンドコード表示
    function renderFriendCodes() {
      const container = document.getElementById('friendCodesList');
      container.innerHTML = '';
      siteData.friendCodes.forEach(item => {
        const el = document.createElement('div');
        el.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between hover:border-slate-700 transition";
        el.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden">
            <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-purple-400 text-sm">
              <i class="fa-solid fa-gamepad"></i>
            </div>
            <div class="truncate">
              <div class="text-xs text-slate-400">${escapeHtml(item.platform)}</div>
              <div class="text-sm font-mono font-medium text-slate-200 truncate">${escapeHtml(item.code)}</div>
            </div>
          </div>
          <div class="flex items-center space-x-1 pl-2">
            <button onclick="copyToClipboard('${escapeHtml(item.code)}')" class="p-1.5 rounded hover:bg-slate-800 text-slate-400 hover:text-slate-200 text-xs" title="コピー">
              <i class="fa-regular fa-copy"></i>
            </button>
            <button onclick="deleteFriendCode(${item.id})" class="admin-only p-1.5 rounded hover:bg-rose-500/20 text-rose-400 text-xs" title="削除">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    // カレンダー表示
    let curDate = new Date();
    function renderCalendar() {
      const year = curDate.getFullYear();
      const month = curDate.getMonth();
      document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 空白マス
      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = "h-20 bg-slate-950/40 rounded-lg border border-slate-900/50";
        grid.appendChild(blank);
      }

      // 日付マス
      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayScheds = siteData.schedules.filter(s => s.date === dateStr);

        const cell = document.createElement('div');
        cell.className = "h-20 bg-slate-800/40 rounded-lg border border-slate-800/80 p-1 flex flex-col overflow-hidden text-xs hover:border-purple-500/40 transition cursor-pointer";
        cell.onclick = () => {
          if (isAdmin) {
            document.getElementById('inputSchedDate').value = dateStr;
            openScheduleModal();
          }
        };

        cell.innerHTML = `
          <div class="font-semibold text-slate-400 mb-1">${d}</div>
          <div class="space-y-1 overflow-y-auto custom-scrollbar flex-1">
            ${dayScheds.map(s => `
              <div class="bg-purple-900/50 border border-purple-500/30 text-purple-200 px-1 py-0.5 rounded text-[10px] truncate" title="${escapeHtml(s.title + ' ' + (s.note || ''))}">
                ${escapeHtml(s.title)}
              </div>
            `).join('')}
          </div>
        `;
        grid.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      curDate.setMonth(curDate.getMonth() + delta);
      renderCalendar();
    }

    // TRPG 一覧
    function renderTrpgList() {
      const container = document.getElementById('trpgList');
      container.innerHTML = '';
      siteData.trpgChars.forEach(char => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-purple-500/40 transition flex flex-col";
        card.innerHTML = `
          <div class="h-44 w-full bg-slate-800 relative cursor-pointer" onclick="viewCharDetail(${char.id})">
            <img src="${char.avatar || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 px-2 py-0.5 text-[11px] rounded-full bg-slate-900/80 backdrop-blur border border-purple-500/30 text-purple-300 font-medium">
              ${escapeHtml(char.system || 'TRPG')}
            </span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h3 class="text-lg font-bold text-white cursor-pointer hover:text-purple-400 transition" onclick="viewCharDetail(${char.id})">
                ${escapeHtml(char.name)}
              </h3>
              <p class="text-xs text-slate-400 line-clamp-2 mt-1">${escapeHtml(char.bio || '')}</p>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
              <button onclick="viewCharDetail(${char.id})" class="text-xs text-purple-400 hover:text-purple-300 font-medium flex items-center gap-1">
                <span>詳細・ふせったー</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
              </button>
              <div class="flex items-center space-x-1">
                <button onclick="editTrpgChar(${char.id})" class="admin-only p-1 text-slate-400 hover:text-slate-200 text-xs">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deleteTrpgChar(${char.id})" class="admin-only p-1 text-rose-400 hover:text-rose-300 text-xs">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Murder Mystery 一覧
    function renderMurderMysteryList() {
      const container = document.getElementById('murderMysteryList');
      container.innerHTML = '';
      siteData.murderMysteries.forEach(mm => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-purple-500/40 transition flex flex-col";
        card.innerHTML = `
          <div class="h-44 w-full bg-slate-800 relative">
            <img src="${mm.image || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 px-2 py-0.5 text-[11px] rounded-full bg-slate-900/80 backdrop-blur border border-purple-500/30 text-purple-300 font-medium flex items-center gap-1">
              <i class="fa-solid fa-shield-halved text-[10px]"></i>
              <span>Murder Mystery</span>
            </span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <div class="text-xs text-purple-400 font-semibold mb-0.5">HO: ${escapeHtml(mm.character)}</div>
              <h3 class="text-lg font-bold text-white">${escapeHtml(mm.scenario)}</h3>
              <p class="text-xs text-slate-400 mt-2 bg-slate-950/40 p-2 rounded-lg border border-slate-800/80">${escapeHtml(mm.review || '一言感想なし')}</p>
            </div>
            
            <!-- ふせったーリンク集 -->
            <div class="space-y-1.5 pt-2 border-t border-slate-800">
              <div class="text-[11px] text-slate-400 font-medium">ネタバレ感想:</div>
              <div class="space-y-1">
                ${(mm.fusetters || []).map(f => `
                  <a href="${f.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-purple-300 border border-slate-700/60 transition">
                    <span class="truncate">${escapeHtml(f.label || 'ふせったーを見る')}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-purple-400"></i>
                  </a>
                `).join('')}
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 admin-only">
              <button onclick="editMurderMystery(${mm.id})" class="p-1 text-slate-400 hover:text-slate-200 text-xs">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteMurderMystery(${mm.id})" class="p-1 text-rose-400 hover:text-rose-300 text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ==========================================================
       5. モーダル・ファイルアップロード補助
    ========================================================== */
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // 画像ファイル読み込み（Base64化）
    function handleImageUpload(inputElem, previewElem, callback) {
      if (!inputElem.files || !inputElem.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        if (previewElem) {
          previewElem.src = e.target.result;
          previewElem.classList.remove('hidden');
        }
        callback(e.target.result);
      };
      reader.readAsDataURL(inputElem.files[0]);
    }

    // プロフィール編集
    let tempProfAvatar = "";
    function openProfileModal() {
      const p = siteData.profile;
      document.getElementById('inputProfName').value = p.name || '';
      document.getElementById('inputProfBio').value = p.bio || '';
      document.getElementById('previewProfAvatar').src = p.avatar || '';
      tempProfAvatar = p.avatar || '';

      const editor = document.getElementById('profileLinksEditor');
      editor.innerHTML = '';
      (p.links || []).forEach(l => addProfileLinkRow(l.title, l.url));

      document.getElementById('inputProfAvatarFile').onchange = (e) => {
        handleImageUpload(e.target, document.getElementById('previewProfAvatar'), base64 => {
          tempProfAvatar = base64;
        });
      };

      openModal('modalProfile');
    }

    function addProfileLinkRow(title = '', url = '') {
      const editor = document.getElementById('profileLinksEditor');
      const row = document.createElement('div');
      row.className = "flex items-center gap-2";
      row.innerHTML = `
        <input type="text" placeholder="名前 (例: X, Discord)" value="${escapeHtml(title)}" class="w-1/3 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs link-title">
        <input type="url" placeholder="https://..." value="${escapeHtml(url)}" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs link-url">
        <button type="button" onclick="this.parentElement.remove()" class="p-1.5 text-rose-400 hover:text-rose-300 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;
      editor.appendChild(row);
    }

    function saveProfile() {
      const rows = document.querySelectorAll('#profileLinksEditor > div');
      const links = [];
      rows.forEach(r => {
        const title = r.querySelector('.link-title').value.trim();
        const url = r.querySelector('.link-url').value.trim();
        if (title || url) links.push({ title, url });
      });

      siteData.profile = {
        name: document.getElementById('inputProfName').value.trim(),
        bio: document.getElementById('inputProfBio').value.trim(),
        avatar: tempProfAvatar,
        links: links
      };
      saveData();
      renderProfile();
      closeModal('modalProfile');
    }

    // フレンドコード
    function openFriendCodeModal() {
      document.getElementById('inputFcPlatform').value = '';
      document.getElementById('inputFcCode').value = '';
      openModal('modalFriendCode');
    }
    function saveFriendCode() {
      const platform = document.getElementById('inputFcPlatform').value.trim();
      const code = document.getElementById('inputFcCode').value.trim();
      if (!platform || !code) return alert("項目を入力してください");

      siteData.friendCodes.push({ id: Date.now(), platform, code });
      saveData();
      renderFriendCodes();
      closeModal('modalFriendCode');
    }
    function deleteFriendCode(id) {
      if (!confirm("削除しますか？")) return;
      siteData.friendCodes = siteData.friendCodes.filter(f => f.id !== id);
      saveData();
      renderFriendCodes();
    }

    // カレンダー予定
    function openScheduleModal() {
      document.getElementById('inputSchedTitle').value = '';
      document.getElementById('inputSchedNote').value = '';
      openModal('modalSchedule');
    }
    function saveSchedule() {
      const date = document.getElementById('inputSchedDate').value;
      const title = document.getElementById('inputSchedTitle').value.trim();
      const note = document.getElementById('inputSchedNote').value.trim();
      if (!date || !title) return alert("日付とタイトルを入力してください");

      siteData.schedules.push({ id: Date.now(), date, title, note });
      saveData();
      renderCalendar();
      closeModal('modalSchedule');
    }

    // ふせったー用 動的追加行
    function addFusetterLinkRow(containerId, label = '', url = '') {
      const c = document.getElementById(containerId);
      const row = document.createElement('div');
      row.className = "flex items-center gap-2 fusetter-row";
      row.innerHTML = `
        <input type="text" placeholder="ラベル (例: シナリオ名 感想)" value="${escapeHtml(label)}" class="w-1/3 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs fusetter-label">
        <input type="url" placeholder="https://fse.tw/..." value="${escapeHtml(url)}" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs fusetter-url">
        <button type="button" onclick="this.parentElement.remove()" class="p-1.5 text-rose-400 hover:text-rose-300 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;
      c.appendChild(row);
    }

    // TRPG キャラ
    let tempTrpgImg = "";
    function openTrpgModal(editItem = null) {
      document.getElementById('trpgEditId').value = editItem ? editItem.id : '';
      document.getElementById('trpgModalTitle').innerText = editItem ? "キャラクター編集" : "キャラクター作成";
      document.getElementById('inputTrpgName').value = editItem ? editItem.name : '';
      document.getElementById('inputTrpgSystem').value = editItem ? editItem.system : '';
      document.getElementById('inputTrpgSheetUrl').value = editItem ? (editItem.sheetUrl || '') : '';
      document.getElementById('inputTrpgBio').value = editItem ? (editItem.bio || '') : '';
      
      const preview = document.getElementById('previewTrpgImg');
      tempTrpgImg = editItem ? (editItem.avatar || '') : '';
      if (tempTrpgImg) {
        preview.src = tempTrpgImg;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }

      document.getElementById('inputTrpgImgFile').onchange = (e) => {
        handleImageUpload(e.target, preview, b64 => { tempTrpgImg = b64; });
      };

      const flist = document.getElementById('trpgFusetterList');
      flist.innerHTML = '';
      if (editItem && editItem.fusetters) {
        editItem.fusetters.forEach(f => addFusetterLinkRow('trpgFusetterList', f.label, f.url));
      }

      openModal('modalTrpg');
    }

    function editTrpgChar(id) {
      const item = siteData.trpgChars.find(c => c.id === id);
      if (item) openTrpgModal(item);
    }

    function deleteTrpgChar(id) {
      if (!confirm("このキャラクターを削除しますか？")) return;
      siteData.trpgChars = siteData.trpgChars.filter(c => c.id !== id);
      saveData();
      renderTrpgList();
    }

    function saveTrpgCharacter() {
      const editId = document.getElementById('trpgEditId').value;
      const name = document.getElementById('inputTrpgName').value.trim();
      const system = document.getElementById('inputTrpgSystem').value.trim();
      if (!name) return alert("名前を入力してください");

      const fusetters = [];
      document.querySelectorAll('#trpgFusetterList .fusetter-row').forEach(row => {
        const label = row.querySelector('.fusetter-label').value.trim();
        const url = row.querySelector('.fusetter-url').value.trim();
        if (url) fusetters.push({ label: label || 'ふせったー感想', url });
      });

      const charObj = {
        id: editId ? Number(editId) : Date.now(),
        name,
        system,
        avatar: tempTrpgImg || "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&h=300&fit=crop",
        sheetUrl: document.getElementById('inputTrpgSheetUrl').value.trim(),
        bio: document.getElementById('inputTrpgBio').value.trim(),
        fusetters
      };

      if (editId) {
        const idx = siteData.trpgChars.findIndex(c => c.id === Number(editId));
        if (idx !== -1) siteData.trpgChars[idx] = charObj;
      } else {
        siteData.trpgChars.push(charObj);
      }

      saveData();
      renderTrpgList();
      closeModal('modalTrpg');
    }

    // キャラ詳細モーダル表示
    function viewCharDetail(id) {
      const c = siteData.trpgChars.find(item => item.id === id);
      if (!c) return;

      document.getElementById('detailCharName').innerText = c.name;
      document.getElementById('detailCharSystem').innerText = c.system || 'TRPG';
      document.getElementById('detailCharImg').src = c.avatar || 'https://via.placeholder.com/150';
      document.getElementById('detailCharBio').innerText = c.bio || '設定の記述はありません。';

      const sheetArea = document.getElementById('detailCharSheetArea');
      const sheetLink = document.getElementById('detailCharSheetUrl');
      if (c.sheetUrl) {
        sheetArea.classList.remove('hidden');
        sheetLink.href = c.sheetUrl;
      } else {
        sheetArea.classList.add('hidden');
      }

      const fList = document.getElementById('detailCharFusetterList');
      fList.innerHTML = '';
      if (c.fusetters && c.fusetters.length > 0) {
        c.fusetters.forEach(f => {
          const a = document.createElement('a');
          a.href = f.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "flex items-center justify-between text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 transition";
          a.innerHTML = `
            <span>${escapeHtml(f.label)}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-purple-400 text-[11px]"></i>
          `;
          fList.appendChild(a);
        });
      } else {
        fList.innerHTML = '<p class="text-xs text-slate-500 italic">登録された感想はありません</p>';
      }

      openModal('modalCharDetail');
    }

    // Murder Mystery
    let tempMmImg = "";
    function openMurderMysteryModal(editItem = null) {
      document.getElementById('mmEditId').value = editItem ? editItem.id : '';
      document.getElementById('murderMysteryModalTitle').innerText = editItem ? "Murder Mystery 記録編集" : "Murder Mystery 記録追加";
      document.getElementById('inputMmScenario').value = editItem ? editItem.scenario : '';
      document.getElementById('inputMmChar').value = editItem ? editItem.character : '';
      document.getElementById('inputMmReview').value = editItem ? (editItem.review || '') : '';

      const preview = document.getElementById('previewMmImg');
      tempMmImg = editItem ? (editItem.image || '') : '';
      if (tempMmImg) {
        preview.src = tempMmImg;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }

      document.getElementById('inputMmImgFile').onchange = (e) => {
        handleImageUpload(e.target, preview, b64 => { tempMmImg = b64; });
      };

      const flist = document.getElementById('mmFusetterList');
      flist.innerHTML = '';
      if (editItem && editItem.fusetters) {
        editItem.fusetters.forEach(f => addFusetterLinkRow('mmFusetterList', f.label, f.url));
      }

      openModal('modalMurderMystery');
    }

    function editMurderMystery(id) {
      const item = siteData.murderMysteries.find(m => m.id === id);
      if (item) openMurderMysteryModal(item);
    }

    function deleteMurderMystery(id) {
      if (!confirm("この記録を削除しますか？")) return;
      siteData.murderMysteries = siteData.murderMysteries.filter(m => m.id !== id);
      saveData();
      renderMurderMysteryList();
    }

    function saveMurderMystery() {
      const editId = document.getElementById('mmEditId').value;
      const scenario = document.getElementById('inputMmScenario').value.trim();
      const character = document.getElementById('inputMmChar').value.trim();
      if (!scenario || !character) return alert("シナリオ名とキャラクター名を入力してください");

      const fusetters = [];
      document.querySelectorAll('#mmFusetterList .fusetter-row').forEach(row => {
        const label = row.querySelector('.fusetter-label').value.trim();
        const url = row.querySelector('.fusetter-url').value.trim();
        if (url) fusetters.push({ label: label || 'ふせったー感想', url });
      });

      const mmObj = {
        id: editId ? Number(editId) : Date.now(),
        scenario,
        character,
        image: tempMmImg || "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&h=300&fit=crop",
        review: document.getElementById('inputMmReview').value.trim(),
        fusetters
      };

      if (editId) {
        const idx = siteData.murderMysteries.findIndex(m => m.id === Number(editId));
        if (idx !== -1) siteData.murderMysteries[idx] = mmObj;
      } else {
        siteData.murderMysteries.push(mmObj);
      }

      saveData();
      renderMurderMysteryList();
      closeModal('modalMurderMystery');
    }

    /* ==========================================================
       6. ユーティリティ
    ========================================================== */
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("コードをコピーしました: " + text);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 初期実行
    applyAdminMode();
    renderProfile();
    renderFriendCodes();
    renderCalendar();
    renderTrpgList();
    renderMurderMysteryList();
  </script>
</body>
